<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Encuentra canciones para cada tiempo y celebración litúrgica.">
  <title>Cancionero Litúrgico</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="pagina-cancionero">
  <main class="cancionero">
    <header class="encabezado">
      <p class="eyebrow">Música para celebrar</p>
      <h1>Cancionero Litúrgico Católico</h1>
      <p class="introduccion">Encuentra la canción adecuada para cada momento.</p>
    </header>

    <section class="panel-busqueda" aria-labelledby="titulo-filtros">
      <div class="titulo-panel">
        <span class="icono-musica" aria-hidden="true">♪</span>
        <div>
          <h2 id="titulo-filtros">Explora el cancionero</h2>
          <p>Combina los filtros o busca una canción por su título.</p>
        </div>
      </div>

      <div class="filtros">
        <div class="campo">
          <label for="tiempo">Tiempo litúrgico</label>
          <select id="tiempo">
            <option value="" selected>No filtrar</option>
            <option value="Adviento">Adviento</option>
            <option value="Navidad">Navidad</option>
            <option value="Ordinario">Ordinario</option>
            <option value="Cuaresma">Cuaresma</option>
            <option value="Pascua">Pascua</option>
          </select>
        </div>

        <div class="campo">
          <label for="misa">Acto religioso</label>
          <select id="misa">
            <option value="" selected>No filtrar</option>
            <option value="Santa María Madre de Dios">Santa María Madre de Dios</option>
            <option value="Epifanía">Epifanía</option>
            <option value="Bautismo de Jesús">Bautismo de Jesús</option>
            <option value="San José">San José</option>
            <option value="Anunciación">Anunciación</option>
            <option value="Miércoles de Cenizas">Miércoles de Cenizas</option>
            <option value="Domingo de Ramos">Domingo de Ramos</option>
            <option value="Vía Crucis">Vía Crucis</option>
            <option value="Jueves Santo">Jueves Santo</option>
            <option value="Viernes Santo">Viernes Santo</option>
            <option value="Pascua de Resurrección">Pascua de Resurrección</option>
            <option value="Ascensión de Jesús">Ascensión de Jesús</option>
            <option value="Pentecostés">Pentecostés</option>
            <option value="Santísima Trinidad">Santísima Trinidad</option>
            <option value="Corpus Cristi">Corpus Cristi</option>
            <option value="Sagrado Corazón de Jesús">Sagrado Corazón de Jesús</option>
            <option value="Santos Pedro y Pablo">Santos Pedro y Pablo</option>
            <option value="Santiago Apostol">Santiago Apostol</option>
            <option value="Asunción de María">Asunción de María</option>
            <option value="Todos los Santos">Todos los Santos</option>
            <option value="Difuntos">Difuntos</option>
            <option value="Cristo Rey">Cristo Rey</option>
            <option value="Inmaculada Concepción">Inmaculada Concepción</option>
            <option value="Navidad">Navidad</option>
            <option value="Ninguno">Ninguna</option>
          </select>
        </div>

        <div class="campo">
          <label for="momento">Momento</label>
          <select id="momento">
            <option value="" selected>No filtrar</option>
            <option value="Entrada">Entrada</option>
            <option value="Penitencial">Penitencial</option>
            <option value="Aspersión">Aspersión</option>
            <option value="Gloria">Gloria</option>
            <option value="Salmo">Salmo</option>
            <option value="Interleccional">Interleccional</option>
            <option value="Ofertorio">Ofertorio</option>
            <option value="Santo">Santo</option>
            <option value="Cordero">Cordero</option>
            <option value="Comunión">Comunión</option>
            <option value="Acción de gracias">Acción de gracias</option>
            <option value="Salida">Salida</option>
            <option value="Marianos">Marianos</option>
            <option value="Infantil">Infantil</option>
            <option value="Adoración">Adoración</option>
          </select>
        </div>

        <div class="campo campo-busqueda">
          <label for="textoBusqueda">Buscar por título</label>
          <input type="text" id="textoBusqueda" placeholder="Ej. Alabaré">
        </div>
        <button id="btnBuscar" type="button">Buscar canciones</button>
      </div>
    </section>

    <section class="seccion-resultados" aria-labelledby="titulo-resultados">
      <div class="encabezado-resultados">
        <div>
          <p class="eyebrow">Tu selección</p>
          <h2 id="titulo-resultados">Resultados</h2>
        </div>
      </div>
      <div id="resultados" aria-live="polite"></div>
    </section>
  </main>

  <script src="canciones.js"></script>
</body>
</html>
